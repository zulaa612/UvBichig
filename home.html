<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Өв бичиг</title>
    <link rel="stylesheet" href="./css/style.css" />

    <script src="./js/typewriter.js" defer></script>
  </head>

  <body>
    <div class="home">
      <!--Header Section-->
      <div class="header-container">
        <header class="nav">
          <div class="logo">
            <span class="logo-symbol">&#x1825;&#x182A;</span>
            <a href="./home.html" class="logo-text">Өв бичиг</a>
          </div>

          <nav class="nav-links">
            <a href="./home.html" class="nav-item"
              >Нүүр <i class="header-icon" data-lucide="house"></i
            ></a>
            <a href="./about.html" class="nav-item"
              >Хичээл <i class="header-icon" data-lucide="book-open-text"></i
            ></a>
            <a href="./exercise.html" class="nav-item"
              >Дасгал <i class="header-icon" data-lucide="notebook-pen"></i
            ></a>
            <a href="./progress.html" class="nav-item"
              >Ахиц <i class="header-icon" data-lucide="trending-up"></i
            ></a>
            <a href="./user.html" class="login"
              >Нэвтрэх <i class="header-icon" data-lucide="circle-user"></i
            ></a>
          </nav>
        </header>

        <!--Hero Section-->
        <div class="hero-container">
          <div class="hero">
            <h1 class="hero-title">Монгол бичиг суралцахуй.</h1>
            <p class="hero-text">
              Монгол үндэсний бичгээ анхан шатнаас нь эхлэн сурч, үсэг холбож,
              үг уншиж, өөрөө бичиж сураарай. Өдөр бүр бага багаар сурцгаая.
            </p>

            <div class="hero-buttons">
              <a class="btn button-primary" href="./lesson.html">Эхлэх</a>
              <a class="btn button-secondary" href="./exercise.html"
                >Дасгал хийх</a
              >
            </div>

            <ul class="hero-stats">
              <li>
                <strong>35<span> үсэг</span></strong>
              </li>
              <li>
                <strong>20+<span>хичээл</span></strong>
              </li>
              <li>
                <strong>100+<span>дасгал</span></strong>
              </li>
            </ul>
          </div>

          <div class="hero-visual">
            <div class="card">
              <div class="hero-script-wrapper">
                <span class="hero-script" id="typewriter-script"></span>
              </div>

              <span class="card-caption">Монгол бичиг</span>

              <span class="chip chip-top">
                <i class="header-icon" data-lucide="sparkles"></i> Өдөр бүр
              </span>
              <span class="chip chip-bottom">
                <i class="header-icon" data-lucide="pen-tool"></i> Бич, сур
              </span>
            </div>
          </div>
        </div>
      </div>

      <!--About Section-->
      <div class="footer"></div>

      <script src="https://unpkg.com/lucide@latest"></script>
      <script>
        lucide.createIcons();
      </script>
    </div>
  </body>
</html>
