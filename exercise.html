    <div class="pagehead">
      <div class="wrap">
        <h1>Дадлага ба сорил</h1>
        <p>Үсгээ таниад, хариултаа сонгоорой.</p>
      </div>
    </div>
    <section>
      <div class="wrap">
        <h2>Эгшиг үсэг</h2>
        <div class="letters">
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1820;</div>
            <b>а</b>
          </div>
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1821;</div>
            <b>э</b>
          </div>
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1822;</div>
            <b>и</b>
          </div>
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1823;</div>
            <b>о</b>
          </div>
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1824;</div>
            <b>у</b>
          </div>
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1825;</div>
            <b>ө</b>
          </div>
          <div class="letter">
            <div class="mn" aria-hidden="true">&#x1826;</div>
            <b>ү</b>
          </div>
        </div>
      </div>
    </section>
    <section class="band">
      <div class="wrap">
        <div class="card quiz" style="max-width: 560px">
          <h3>Асуулт 1 / 5</h3>
          <p>Энэ үсэг ямар дуу заадаг вэ?</p>
          <div class="mn" role="img" aria-label="Монгол бичгийн үсэг">
            &#x1825;
          </div>
          <label><input type="radio" name="q" />о</label
          ><label><input type="radio" name="q" />ө</label
          ><label><input type="radio" name="q" />у</label
          ><label><input type="radio" name="q" />ү</label>
          <p style="margin-top: 18px"><a class="btn" href="#">Шалгах</a></p>
        </div>
      </div>
    </section>
    <footer>
